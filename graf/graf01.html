<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Primer z grafom
    <br>
    <canvas id="platno-1" width="800" height="100" style="border:1px dashed #099999"></canvas>
    <script>
        "use strict"; //omogoča strožjo sintakso in boljše preverjanje napak, vse spremenljivke morajo biti deklarirane

        let can1,platno1; //deklaracija spremenljivk za platno
        //vrstici za delo s platnom, ki omogočata risanje na platno
        //"boilerplate" koda za platno ("koda deklaracijske ploščice bojlerja")
        can1=document.getElementById("platno-1"); //dostop do elementa platna preko ID-ja iz HTML dokumenta
        platno1=can1.getContext("2d"); //dostop do 2D konteksta platna, ki omogoča risanje na platno, od tu dalje za risanje uporabimo spremenljivko "platno1"


        platno1.strokeStyle="#FF0000"; //nastavitev rdeče barve črte
        platno1.beginPath(); //začetek nove poti za risanje
        platno1.lineTo(10,70); //prva točka na platnu   
        platno1.lineTo(110,35); //druga točka na platnu
        platno1.lineTo(210,50); //tretja točka na platnu
        platno1.lineTo(310,25); //četrta točka na platnu
        platno1.lineTo(410,45); //peta točka na platnu
        platno1.lineTo(510,15); //šesta točka na platnu
        platno1.stroke(); //izris poti, ki smo jo definirali z lineTo metodami, na platno
    </script>
</body>
</html>
